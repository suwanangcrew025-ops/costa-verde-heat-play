<!doctype html>
<!-- Halaman pembungkus Costa Verde Heat, kutulis ulang keterangannya di sesi ini: dua kanvas bertumpuk (dunia 3D di bawah, HUD di atas) ditambah lapisan kontrol sentuh — joystick virtual dan tombol FIRE/ACT/CAR — yang hanya muncul di browser HP. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Costa Verde Heat — an original open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f1e; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .touch { display: none; }
  body.touch .touch { display: block; }
  #joy { position: fixed; left: 18px; bottom: 118px; width: 108px; height: 108px; border-radius: 50%; background: rgba(8,13,22,0.45); border: 2px solid rgba(255,210,60,0.5); z-index: 5; touch-action: none; }
  #joyKnob { position: absolute; left: 34px; top: 34px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,210,60,0.65); }
  .tbtn { position: fixed; z-index: 5; width: 62px; height: 62px; border-radius: 50%; background: rgba(8,13,22,0.55); color: #fff; border: 2px solid rgba(255,255,255,0.55); font: 800 12px Arial; touch-action: none; }
  #btnFire { right: 20px; bottom: 190px; border-color: #ff6a4d; }
  #btnAct { right: 92px; bottom: 118px; border-color: #43c6ac; }
  #btnCar { right: 20px; bottom: 118px; border-color: #ffd23c; }
</style>
</head>
<body>
<canvas id="gl" aria-label="Costa Verde Heat 3D view"></canvas>
<canvas id="hud" aria-label="Costa Verde Heat: an open-world crime game. Walk with W A S D, drive with W A S D, press F to enter or leave a car, E to talk or use, mouse to aim, click to shoot, M for the city map, G at the garage, P to pause."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="joy" class="touch" aria-label="Virtual joystick"><div id="joyKnob"></div></div>
<button id="btnFire" class="tbtn touch" aria-label="Shoot">FIRE</button>
<button id="btnAct" class="tbtn touch" aria-label="Interact">ACT</button>
<button id="btnCar" class="tbtn touch" aria-label="Enter or leave car">CAR</button>
<!-- Satu-satunya skrip halaman ini: modul utama gim yang merakit seluruh sistem. -->
<div id="boot" style="position:fixed;top:14px;left:0;right:0;text-align:center;color:#ffd76a;font-family:sans-serif;font-size:15px;z-index:9999;pointer-events:none">Memuat Costa Verde Heat&#8230;</div>
<script>
window.__bootErrored=false;
window.addEventListener('error',function(e){window.__bootErrored=true;var b=document.getElementById('boot');if(b){b.style.display='block';b.style.color='#ff7b7b';b.textContent='Ada kesalahan saat memuat game: '+((e&&e.message)||'tidak diketahui')+' — tangkap layar ini dan kirim ke Suwanang.';}});
setTimeout(function(){if(!window.__bootErrored){var b=document.getElementById('boot');if(b)b.style.display='none';}},9000);
</script>
